# AMCL 参数：在已经保存的地图中估计 cakebot 的位姿。
#
# 该文件只配置 AMCL。地图服务器和 AMCL 的启动、生命周期管理由
# localization.launch.py 负责；不要在定位时同时启动 slam_toolbox。
amcl:
  ros__parameters:
    # Gazebo 使用仿真时钟，AMCL 必须使用同一时间源。
    use_sim_time: true

    # cakebot 当前没有 base_footprint，机器人根坐标系是 base_link。
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    map_topic: /map

    # 差速驱动运动模型。odom -> base_link 由 Gazebo 发布，AMCL
    # 根据里程计预测，再用激光和地图进行校正并发布 map -> odom。
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.5

    # 里程计运动噪声。仿真里程计较理想，先使用 Humble 默认值，
    # 后续若要模拟更大的里程计误差，再单独调大这些参数。
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # 自适应粒子滤波范围。地图较小，使用默认范围即可观察收敛过程。
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # 激光似然场模型。范围与 cakebot.urdf.xacro 中的二维雷达一致。
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1

    # 暂不启用 beam skip；测试环境中的墙体和障碍物应参与匹配。
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # 位移/转角达到阈值后进行一次 AMCL 更新。
    update_min_d: 0.25
    update_min_a: 0.2
    save_pose_rate: 0.5

    # 初始位姿由 RViz 的 2D Pose Estimate 或测试脚本发布到
    # /initialpose。这样可以在每次实验中明确控制初始条件。
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
